name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip


      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Create findings directory
        run: mkdir -p findings


      - name: Run Checkov
        run: |
          checkov \
            -d terraform \
            --framework terraform \
            -o json \
            --soft-fail \
            > findings/checkov.json


      - name: Run Semgrep
        run: |
          semgrep scan \
            --config security/semgrep.yml \
            --json \
            app/ \
            > findings/semgrep.json


      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: app
          scanners: vuln
          format: json
          output: findings/trivy.json
          exit-code: "0"
          version: v0.74.0


      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo \
            --config /repo/.gitleaks.toml \
            --report-format json \
            --report-path /repo/findings/gitleaks.json \
            --redact \
            --exit-code 0


      - name: Ensure Gitleaks report exists
        run: |
          if [ ! -f findings/gitleaks.json ]; then
            echo "[]" > findings/gitleaks.json
          fi


      - name: Display aggregated findings
        run: python src/report.py

      - name: Run AI security triage
        if: github.event_name != 'pull_request'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured"
            exit 1
          fi

          python src/triage.py

          
      - name: Add AI triage to workflow summary
        if: github.event_name != 'pull_request'
        run: |
          cat findings/ai_triage.md >> "$GITHUB_STEP_SUMMARY"


      - name: Upload security reports
        uses: actions/upload-artifact@v7
        with:
          name: security-findings
          path: findings/
          retention-days: 14